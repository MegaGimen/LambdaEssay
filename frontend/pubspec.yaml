name: git_graph_web
description: Flutter Web frontend for Git graph visualization
version: 0.1.0
environment:
  sdk: ">=3.0.0 <4.0.0"
dependencies:
  flutter:
    sdk: flutter
  # 从 git_graph_server 合并的依赖
  shelf: ^1.4.0
  shelf_router: ^1.1.0
  uuid: ^4.5.2
  process: ^4.2.4
  shelf_web_socket: ^3.0.0
  ffi: ^2.1.4
  win32: ^5.15.0
  docx_to_text: ^1.0.1
  # 原 git_graph_web 的依赖（保留更新的版本）
  http: ^1.6.0          # 更新自 1.2.0
  shared_preferences: ^2.2.2
  archive: ^3.6.1       # 更新自 3.4.10
  xml: ^6.5.0
  syncfusion_flutter_pdfviewer: ^31.1.19
  file_picker: ^10.3.8
  web_socket_channel: ^3.0.3 # 更新自 2.4.0
  path_provider: ^2.1.5
  crypto: ^3.0.7        # 更新自 3.0.0
  file_tree_view: ^0.0.7
  path: ^1.9.0          # 更新自 1.8.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0 # 保留主项目的 lints 配置
  lints: ^6.0.0

flutter:
  uses-material-design: true